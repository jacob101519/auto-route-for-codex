name: Documentation issue (English)
description: Report missing, inaccurate, inconsistent, or stale documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Document path or URL
      placeholder: docs/installation.md
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Simplified Chinese
        - Both
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or evidence
      description: Link to authoritative evidence when the claim is version-sensitive.
