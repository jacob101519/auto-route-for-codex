name: 错误报告（简体中文）
description: 报告公开版中可以复现的缺陷。
title: "[Bug][zh-CN]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交 credential（凭据）、私有任务正文、本机路径或 session identifier（任务标识）。
  - type: input
    id: version
    attributes:
      label: Version（版本）
      placeholder: 0.4.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Codex surface（Codex 使用界面）
      options:
        - Codex Desktop（桌面端）
        - Codex CLI（命令行工具）
        - Codex IDE extension（编辑器扩展）
        - Other or unknown（其他或未知）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction（最小复现）
      description: 请使用 synthetic data（合成数据）描述最短且安全的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior（预期行为）
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior（实际行为）
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks（安全检查）
      options:
        - label: 我已移除凭据、私有任务正文、本机路径和任务标识。
          required: true
        - label: 我确认这不是需要私密报告的 security issue（安全问题）。
          required: true
