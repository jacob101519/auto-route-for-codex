name: 路由不匹配（简体中文）
description: 报告过低、过高、意外未解析或执行方式错误的建议。
title: "[Routing mismatch][zh-CN]: "
labels: [routing]
body:
  - type: markdown
    attributes:
      value: 只提交 structured profile（结构化画像），不要粘贴私有任务正文或本机 receipt（回执）。
  - type: input
    id: version
    attributes:
      label: Version（版本）
      placeholder: 0.4.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: mismatch
    attributes:
      label: Mismatch type（不匹配类型）
      options:
        - Recommendation is too weak（建议过低）
        - Recommendation is too strong（建议过高）
        - Recommendation is unresolved unexpectedly（意外未解析）
        - Topology is incorrect（执行方式错误）
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Sanitized router input（已清理的路由输入）
      description: 只包含 router-input.schema.json 接受的 enum（枚举）和计数字段。
      render: json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Router output（路由输出）
      render: json
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 为什么 recommendation（建议）不匹配
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation（隐私确认）
      options:
        - label: 报告不包含任务正文、本机路径、凭据、任务标识或私有 catalog（目录）。
          required: true
