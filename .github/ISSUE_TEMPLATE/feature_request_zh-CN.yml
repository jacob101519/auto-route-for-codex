name: 功能建议（简体中文）
description: 用具体场景提出符合公开安全边界的改进。
title: "[Feature][zh-CN]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve（要解决的问题）
      description: 请说明用户能感知的问题，不要包含私有任务正文。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome（期望结果）
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: 是否保持 capability-gated continuation（能力门槛控制的任务继续）与 recommendation-only fallback（仅建议后备行为）？
      options:
        - "Yes（是）"
        - "Unsure（不确定）"
        - "No（否）"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence（验收证据）
      description: 请说明哪些 test（测试）或可观察行为能够证明完成。
    validations:
      required: true
