name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r .github/requirements-ci.txt
      - name: Fetch pinned official validators
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/openai-quick-validate.py https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/openai-validate-plugin.py https://raw.githubusercontent.com/openai/codex/0fb559f0f6e231a88ac02ea002d3ecd248e2b515/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          echo '6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51  /tmp/openai-quick-validate.py' | sha256sum --check --strict
          echo 'ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228  /tmp/openai-validate-plugin.py' | sha256sum --check --strict
      - name: Run official Skill validator
        run: python3 /tmp/openai-quick-validate.py skills/auto-route-for-codex
      - name: Run official Plugin validator
        run: python3 /tmp/openai-validate-plugin.py .
      - name: Verify public repository
        run: python3 scripts/verify_public_repo.py --require-git-history
      - name: Run release-pipeline security tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run router unit tests
        run: python3 -m unittest discover -s skills/auto-route-for-codex/tests -v
      - name: Validate router contracts
        run: python3 skills/auto-route-for-codex/scripts/validate_contracts.py
      - name: Build deterministic release artifacts
        run: python3 scripts/build_release.py --output-dir dist
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-route-for-codex-${{ github.sha }}
          path: |
            dist/auto-route-for-codex-0.5.0-alpha.2.zip
            dist/SHA256SUMS
          if-no-files-found: error
