name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the tagged commit is in main history
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install hash-locked verification dependencies
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r .github/requirements-ci.txt
      - name: Verify repository and complete reachable history
        run: python3 scripts/verify_public_repo.py --require-git-history
      - name: Run release-pipeline security tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run router unit tests
        run: python3 -m unittest discover -s skills/auto-route-for-codex/tests -v
      - name: Validate router contracts
        run: python3 skills/auto-route-for-codex/scripts/validate_contracts.py
      - name: Build the release twice and compare bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output-dir "$RUNNER_TEMP/release-a" --expected-tag "$RELEASE_TAG"
          python3 scripts/build_release.py --output-dir "$RUNNER_TEMP/release-b" --expected-tag "$RELEASE_TAG"
          cmp "$RUNNER_TEMP/release-a/auto-route-for-codex-${RELEASE_TAG#v}.zip" "$RUNNER_TEMP/release-b/auto-route-for-codex-${RELEASE_TAG#v}.zip"
          cmp "$RUNNER_TEMP/release-a/SHA256SUMS" "$RUNNER_TEMP/release-b/SHA256SUMS"
          cd "$RUNNER_TEMP/release-a"
          sha256sum --check --strict SHA256SUMS
      - name: Attest release payload
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/release-a/*.zip
            ${{ runner.temp }}/release-a/SHA256SUMS
      - name: Upload the verified release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-a/*.zip
            ${{ runner.temp }}/release-a/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Validate the bounded release payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          test -f "auto-route-for-codex-${RELEASE_TAG#v}.zip"
          test -f SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          sha256sum --check --strict SHA256SUMS
      - name: Publish exactly one immutable release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          ASSET_DIR: ${{ runner.temp }}/release
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        with:
          retries: 3
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = process.env.RELEASE_TAG;
            const expectedCommit = process.env.TAG_COMMIT;
            const assetDir = process.env.ASSET_DIR;
            const settingsToken = process.env.RELEASE_SETTINGS_READ_TOKEN;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(tagName)) {
              throw new Error("release_tag_format");
            }
            if (!settingsToken) throw new Error("release_settings_token_missing");
            const isPrerelease = tagName.includes("-");
            const settings = getOctokit(settingsToken);
            const apiHeaders = {
              accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
            };
            const expectedNames = [
              `auto-route-for-codex-${tagName.slice(1)}.zip`,
              "SHA256SUMS",
            ];
            const payloads = new Map(expectedNames.map((name) => {
              const data = fs.readFileSync(path.join(assetDir, name));
              const digest = `sha256:${crypto.createHash("sha256").update(data).digest("hex")}`;
              return [name, {data, digest}];
            }));

            async function tagCommit() {
              let object = (await github.rest.git.getRef({owner, repo, ref: `tags/${tagName}`})).data.object;
              while (object.type === "tag") {
                object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
              }
              if (object.type !== "commit") throw new Error("release_tag_target_type");
              return object.sha;
            }

            async function releaseByTag() {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner, repo, per_page: 100,
              });
              return releases.find((item) => item.tag_name === tagName) || null;
            }

            async function assetsFor(releaseId) {
              return await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: releaseId, per_page: 100,
              });
            }

            async function verifyAssets(releaseId) {
              const assets = await assetsFor(releaseId);
              if (assets.length !== expectedNames.length) throw new Error("release_asset_count");
              for (const asset of assets) {
                const expected = payloads.get(asset.name);
                if (!expected) throw new Error(`release_unknown_asset:${asset.name}`);
                if (asset.digest !== expected.digest) throw new Error(`release_asset_digest:${asset.name}`);
              }
            }

            async function assertPublishable() {
              if (await tagCommit() !== expectedCommit) throw new Error("release_tag_moved");
              const immutable = await settings.request(
                "GET /repos/{owner}/{repo}/immutable-releases",
                {owner, repo, headers: apiHeaders},
              );
              if (immutable.data.enabled !== true) {
                throw new Error("immutable_releases_not_enabled");
              }
              const main = await github.request(
                "GET /repos/{owner}/{repo}/git/ref/{ref}",
                {owner, repo, ref: "heads/main", headers: apiHeaders},
              );
              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{basehead}",
                {
                  owner,
                  repo,
                  basehead: `${expectedCommit}...${main.data.object.sha}`,
                  headers: apiHeaders,
                },
              );
              if (!["ahead", "identical"].includes(comparison.data.status)) {
                throw new Error("release_commit_not_in_main");
              }
              const runs = await github.request(
                "GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs",
                {
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  branch: "main",
                  event: "push",
                  head_sha: expectedCommit,
                  status: "success",
                  per_page: 100,
                  headers: apiHeaders,
                },
              );
              const verified = runs.data.workflow_runs.some((run) =>
                run.head_sha === expectedCommit
                && run.head_branch === "main"
                && run.event === "push"
                && run.status === "completed"
                && run.conclusion === "success"
                && run.path === ".github/workflows/ci.yml"
              );
              if (!verified) throw new Error("release_commit_ci_not_successful");
            }

            await assertPublishable();
            let release = await releaseByTag();
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                target_commitish: expectedCommit,
                name: `Auto Route for Codex ${tagName}`,
                draft: true,
                prerelease: isPrerelease,
                generate_release_notes: true,
                make_latest: "false",
              })).data;
            } else if (!release.draft) {
              if (!release.immutable) throw new Error("release_published_but_mutable");
              if (release.prerelease !== isPrerelease) {
                throw new Error("release_prerelease_mismatch");
              }
              await verifyAssets(release.id);
              await assertPublishable();
              return;
            }

            const existingAssets = await assetsFor(release.id);
            for (const asset of existingAssets) {
              const expected = payloads.get(asset.name);
              if (!expected) throw new Error(`release_unknown_draft_asset:${asset.name}`);
              if (asset.digest !== expected.digest) throw new Error(`release_draft_asset_digest:${asset.name}`);
            }
            const existingNames = new Set(existingAssets.map((asset) => asset.name));
            for (const [name, payload] of payloads) {
              if (existingNames.has(name)) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data: payload.data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": payload.data.length,
                },
              });
            }
            await verifyAssets(release.id);
            await assertPublishable();
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: isPrerelease,
              make_latest: "false",
            });
            for (let attempt = 0; attempt < 5; attempt += 1) {
              release = (await github.rest.repos.getRelease({
                owner, repo, release_id: release.id,
              })).data;
              if (!release.draft && release.immutable) break;
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (release.draft || !release.immutable) throw new Error("release_not_immutable");
            if (release.prerelease !== isPrerelease) {
              throw new Error("release_prerelease_mismatch");
            }
            await verifyAssets(release.id);
            await assertPublishable();
